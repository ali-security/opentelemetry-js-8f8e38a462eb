name: Unit Tests
on:
  workflow_dispatch:

jobs:
  node-tests:
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - "14"
          - "16"
          - "18"
          - "20"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: ${{ matrix.node_version }}

      - name: Pin npm registry to release date
        run: npm config set registry https://:2023-12-14T12%3A35%3A23.074Z@time-machines-npm.sealsecurity.io/

      - run: npm install -g npm@latest
        if: ${{ matrix.node_version == '18' || matrix.node_version == '20' }}

      # npm@10.0.0 drops support for Node.js v14 and v16
      - run: npm install -g npm@"<10.0.0"
        if: ${{ matrix.node_version == '14' || matrix.node_version == '16' }}

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        run: |
          # TODO(legendecas): webpack https://stackoverflow.com/questions/69692842/error-message-error0308010cdigital-envelope-routinesunsupported
          if [ "${{ matrix.node_version }}" = "18" ] || [ "${{ matrix.node_version }}" == "20" ]; then
            export NODE_OPTIONS=--openssl-legacy-provider
          fi
          npm run test

      - name: Pack @opentelemetry/core
        if: ${{ matrix.node_version == '20' }}
        run: |
          mkdir -p /tmp/pack_out
          npm pack --workspace=packages/opentelemetry-core --pack-destination=/tmp/pack_out
          mv /tmp/pack_out/opentelemetry-core-1.19.0.tgz /tmp/pack_out/core-1.19.0.tgz
          ls -l /tmp/pack_out

      - name: Upload package artifact
        if: ${{ matrix.node_version == '20' }}
        uses: actions/upload-artifact@v4
        with:
          name: core-1.19.0-tgz
          path: /tmp/pack_out/core-1.19.0.tgz
          if-no-files-found: error
  node-windows-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: '18'

      - name: Pin npm registry to release date
        run: npm config set registry https://:2023-12-14T12%3A35%3A23.074Z@time-machines-npm.sealsecurity.io/

      - run: npm install -g npm@latest

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: |
          npm config set script-shell "C:\\Program Files\\git\\bin\\bash.exe"
          npm run compile

      - name: Unit tests
        env:
         NODE_OPTIONS: --openssl-legacy-provider
        run: npm run test
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 16

      - name: Pin npm registry to release date
        run: npm config set registry https://:2023-12-14T12%3A35%3A23.074Z@time-machines-npm.sealsecurity.io/

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        run: npm run test:browser
  webworker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NPM_CONFIG_UNSAFE_PERM: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 16

      - name: Pin npm registry to release date
        run: npm config set registry https://:2023-12-14T12%3A35%3A23.074Z@time-machines-npm.sealsecurity.io/

      - name: Bootstrap
        run: npm ci

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        run: npm run test:webworker
  api-eol-node-test:
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - "8"
          - "10"
          - "12"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: ${{ matrix.node_version }}

      - name: Pin npm registry to release date
        run: npm config set registry https://:2023-12-14T12%3A35%3A23.074Z@time-machines-npm.sealsecurity.io/

      - name: Build
        working-directory: ./api
        run: |
          npm install --ignore-scripts
          npm install @types/mocha@^7 mocha@^7 ts-loader@^8 ts-mocha@^8
          node ../scripts/version-update.js
          npx tsc --build tsconfig.json tsconfig.esm.json

      - name: Test
        working-directory: ./api
        # running test:eol as node 8 is not supported anymore by the version of nyc we use, as we don't report coverage
        # for this step we leave it out.
        # Details: nyc requires istanbul-lib-report, which silently dropped support for Node.js v8 when going from
        # 3.0.0 to 3.0.1 by requiring make-dir@^4.0.0 to fix https://github.com/advisories/GHSA-c2qf-rxjj-qqgw.
        # make-dir does not support Node.js v8 anymore.
        run: npm run test:eol
